name: Generate GitHub Metrics

on:
  # Update automatically every day at midnight
  schedule:
    - cron: "0 0 * * *"
  # Allow running manually from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Generate Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          # Use a Personal Access Token (PAT) to fetch data across all your repositories
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Core Options
          user: Amr-Ma7moud
          template: classic
          base: header, activity, community, repositories
          config_timezone: UTC
          optimize: css, xml
          repositories_forks: false
          
          # Aesthetics
          config_animations: yes
          
          # Languages Plugin
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          
          # Isometric Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Lines of Code
          plugin_lines: yes
