<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d7a7">
         <animate attributeName="stop-color" values="#00d7a7;#0077ff;#00d7a7" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8a2be2">
         <animate attributeName="stop-color" values="#8a2be2;#ff007f;#8a2be2" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  
  <g transform="translate(32, 32)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
      
      <!-- Outer dashed orbit -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#globeGrad)" stroke-width="4" stroke-dasharray="15 15" opacity="0.6" />
      
      <!-- Inner globe outline -->
      <circle cx="0" cy="0" r="20" fill="none" stroke="url(#globeGrad)" stroke-width="3" />
      
      <!-- Latitude and Longitude ellipses -->
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="url(#globeGrad)" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="8" ry="20" fill="none" stroke="url(#globeGrad)" stroke-width="2" />
      
      <!-- Network nodes -->
      <circle cx="0" cy="-20" r="4" fill="#ffffff">
         <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite" />
      </circle>
      <circle cx="20" cy="0" r="4" fill="#ffffff">
         <animate attributeName="r" values="3;5;3" dur="1s" begin="0.25s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="20" r="4" fill="#ffffff">
         <animate attributeName="r" values="3;5;3" dur="1s" begin="0.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="-20" cy="0" r="4" fill="#ffffff">
         <animate attributeName="r" values="3;5;3" dur="1s" begin="0.75s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
</svg>
