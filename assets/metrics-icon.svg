<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2">
         <animate attributeName="stop-color" values="#8a2be2;#ff007f;#8a2be2" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00d7a7">
         <animate attributeName="stop-color" values="#00d7a7;#0077ff;#00d7a7" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(32, 32)">
    <!-- Base line -->
    <line x1="-24" y1="20" x2="24" y2="20" stroke="#444" stroke-width="4" stroke-linecap="round" />
    
    <!-- Bar 1 -->
    <rect x="-18" y="0" width="8" height="20" rx="3" fill="url(#barGrad)">
      <animate attributeName="y" values="0; 10; 0" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="height" values="20; 10; 20" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <circle cx="-14" cy="-6" r="3" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cy" values="-6; 4; -6" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Bar 2 -->
    <rect x="-4" y="-10" width="8" height="30" rx="3" fill="url(#barGrad)">
      <animate attributeName="y" values="-10; 5; -10" dur="1.5s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="height" values="30; 15; 30" dur="1.5s" begin="0.3s" repeatCount="indefinite" />
    </rect>
    <circle cx="0" cy="-16" r="3" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cy" values="-16; -1; -16" dur="1.5s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="0.3s" repeatCount="indefinite" />
    </circle>

    <!-- Bar 3 -->
    <rect x="10" y="-20" width="8" height="40" rx="3" fill="url(#barGrad)">
      <animate attributeName="y" values="-20; -5; -20" dur="1.5s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="height" values="40; 25; 40" dur="1.5s" begin="0.6s" repeatCount="indefinite" />
    </rect>
    <circle cx="14" cy="-26" r="3" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cy" values="-26; -11; -26" dur="1.5s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="0.6s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
